name: akshi
description: A private, local-first domain and TLS expiry monitor.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.13.4
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.3.0
  flex_color_scheme: ^9.0.0
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1
  flutter_lucide: ^1.47.0
  sqflite: ^2.4.4
  shared_preferences: ^2.5.5
  flutter_local_notifications: ^22.3.1
  flutter_timezone: ^5.1.0
  timezone: ^0.11.1
  crypto: ^3.0.7
  path: ^1.9.1
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/OFL-SpaceGrotesk.txt
    - assets/fonts/OFL-JetBrainsMono.txt
  fonts:
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Variable.ttf
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Variable.ttf
